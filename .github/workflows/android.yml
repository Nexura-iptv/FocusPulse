name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Generate APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Locate Project & Prepare Required Files
        env:
          GRADLE_OPTS: "-Djava.awt.headless=true -Dfile.encoding=UTF-8 -Xmx4096m"
        run: |
          echo "Android projesi tespit ediliyor..."
          SETTINGS_FILE=$(find . -maxdepth 3 -name "settings.gradle*" | head -n 1)
          
          if [ -z "$SETTINGS_FILE" ]; then
            echo "HATA: settings.gradle dosyası bulunamadı!"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "Proje dizini: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          # 1. build.gradle.kts'in beklediği ${rootDir}/debug.keystore dosyasını oluştur
          if [ ! -f "debug.keystore" ]; then
            echo "debug.keystore oluşturuluyor..."
            keytool -genkey -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 2. .env ve .env.example dosyalarını oluştur
          touch .env
          if [ ! -f ".env.example" ]; then
            echo "GEMINI_API_KEY=dummy_key" > .env.example
          fi

          # 3. google-services.json eksikliğini önlemek için dummy dosya oluştur
          mkdir -p app
          if [ ! -f "app/google-services.json" ]; then
            echo '{
              "project_info": {
                "project_number": "1234567890",
                "project_id": "focuspulse-dummy"
              },
              "client": [{
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:abcdef",
                  "android_client_info": {
                    "package_name": "com.example"
                  }
                }
              }],
              "configuration_version": "1"
            }' > app/google-services.json
          fi

          # 4. KSP / Gradle çakışmasını engellemek için daemon olmadan derle
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FocusPulse-Debug-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          retention-days: 14
