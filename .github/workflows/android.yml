name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Generate APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Locate Android Project & Build APK
        env:
          GRADLE_OPTS: "-Djava.awt.headless=true -Dfile.encoding=UTF-8 -Xmx4096m -XX:MaxMetaspaceSize=1024m"
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
        run: |
          echo "Android projesi aranıyor..."
          SETTINGS_FILE=$(find . -maxdepth 3 -name "settings.gradle*" | head -n 1)
          
          if [ -z "$SETTINGS_FILE" ]; then
            echo "HATA: settings.gradle dosyası bulunamadı!"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "Proje dizini: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          # 1. .env ve .env.example dosyalarını oluştur
          touch .env
          if [ ! -f ".env.example" ]; then
            echo "GEMINI_API_KEY=dummy_key" > .env.example
          fi

          # 2. validateSigningDebug için varsayılan debug.keystore oluştur
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          
          # 3. APK derlemesini çalıştır (headless ve single-daemon ile)
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FocusPulse-Debug-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          retention-days: 14
