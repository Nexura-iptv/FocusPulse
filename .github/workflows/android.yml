name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Generate APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Locate Project & Build APK
        env:
          JAVA_OPTS: "-Djava.awt.headless=true"
          GRADLE_OPTS: "-Djava.awt.headless=true -Dfile.encoding=UTF-8 -Xmx4096m"
        run: |
          echo "Android projesi aranıyor..."
          SETTINGS_FILE=$(find . -maxdepth 3 -name "settings.gradle*" | head -n 1)
          
          if [ -z "$SETTINGS_FILE" ]; then
            echo "HATA: settings.gradle dosyası bulunamadı!"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "Proje dizini: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          # 1. KSP ve Kotlin AWT-EventQueue çökmesini engelleyen gradle.properties ayarları
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx4096m -Djava.awt.headless=true -Dfile.encoding=UTF-8
          org.gradle.parallel=false
          ksp.use.worker.api=false
          ksp.incremental=false
          kotlin.compiler.execution.strategy=in-process
          EOF

          # 2. build.gradle.kts için debug.keystore oluştur
          if [ ! -f "debug.keystore" ]; then
            echo "debug.keystore oluşturuluyor..."
            keytool -genkey -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 3. .env ve .env.example oluştur
          touch .env
          if [ ! -f ".env.example" ]; then
            echo "GEMINI_API_KEY=dummy_key" > .env.example
          fi

          # 4. Google Services eklentisi için tam formatlı google-services.json
          mkdir -p app
          cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "focuspulse-dummy",
              "storage_bucket": "focuspulse-dummy.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:abcdef1234567890",
                  "android_client_info": {
                    "package_name": "com.example"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyKeyForGoogleServicesPlugin12345"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

          # 5. Gradle 9.3.1 ile APK derlemesini çalıştır
          gradle assembleDebug --no-daemon --stacktrace -Djava.awt.headless=true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FocusPulse-Debug-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          retention-days: 14
