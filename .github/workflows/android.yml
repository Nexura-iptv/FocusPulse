name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Generate APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Locate Android Project & Build APK
        run: |
          echo "Android projesi aranıyor..."
          SETTINGS_FILE=$(find . -maxdepth 3 -name "settings.gradle*" | head -n 1)
          
          if [ -z "$SETTINGS_FILE" ]; then
            echo "HATA: settings.gradle dosyası bulunamadı!"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "Proje dizini: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          # Secrets Gradle eklentisi için .env ve .env.example dosyalarını otomatik oluştur
          touch .env
          if [ ! -f ".env.example" ]; then
            echo "GEMINI_API_KEY=dummy_key" > .env.example
          fi
          
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FocusPulse-Debug-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          retention-days: 14
